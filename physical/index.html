<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Physical Lab</title>
    <script type="module" crossorigin src="/physical/assets/main-Bynq__rB.js"></script>
    <link rel="modulepreload" crossorigin href="/physical/assets/sg90MotorReorientDrag-Ca2njy4U.js">
    <link rel="stylesheet" crossorigin href="/physical/assets/sg90MotorReorientDrag-DToj8Zcg.css">
    <script type="module" src="/physical/js/pose-bridge.js"></script>
</head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">
          <span class="mark">$</span>
          <div>
            <strong>Physical Lab</strong>
          </div>
        </div>
        <div id="controls" class="controls" aria-label="Simulation controls">
          <button id="btn-play" type="button">Play</button>
          <button id="btn-pause" type="button" disabled>Pause</button>
          <div class="script-controls" role="group" aria-label="Lab script">
            <label class="script-select-wrap" for="script-select">
              <span class="visually-hidden">Script</span>
              <select id="script-select" title="Choose a motion script" disabled>
                <option value="">Script…</option>
              </select>
            </label>
            <button
              id="btn-script-run"
              type="button"
              disabled
              title="Run selected script (starts motors; hit Play if paused)"
            >
              Run
            </button>
            <button
              id="btn-script-stop"
              type="button"
              disabled
              hidden
              title="Stop script"
            >
              Stop
            </button>
          </div>
          <button id="btn-reset" type="button">Reset</button>
          <button
            id="btn-save"
            type="button"
            disabled
            hidden
            title="Use Save on the bottom-right pose chip"
          >
            Save
          </button>
          <button id="btn-camera" type="button" aria-pressed="true" title="Toggle ViewCube camera">Camera</button>
          <button id="btn-scene" type="button" aria-pressed="true" title="Toggle Scene panel">Scene</button>
          <button
            id="btn-record"
            type="button"
            aria-pressed="false"
            title="Record canvas (WebM)"
          >
            Record
          </button>
        </div>
        <p id="status" role="status" class="topbar-status">Loading…</p>
      </header>
      <div id="record-bar" class="record-bar" hidden>
        <span id="record-live" class="record-live" hidden aria-live="polite">
          <span class="record-dot" aria-hidden="true"></span>
          Recording…
        </span>
        <a id="btn-download" class="download-link" href="#" download hidden
          >Download video</a
        >
        <span class="record-tip">WebM</span>
      </div>

      <aside id="selection-panel" class="selection-panel" aria-label="Selected object" hidden>
        <header class="panel-header">
          <strong id="sel-name">Item</strong>
        </header>
        <p id="sel-status" class="sel-status" role="status"></p>
        <div id="sel-group" class="sel-group" hidden>
          <div class="sel-group-head">
            <strong>Group</strong>
            <span id="sel-group-meta" class="sel-group-meta"></span>
          </div>
          <div id="sel-group-links" class="sel-group-links" role="list"></div>
          <p id="sel-group-hint" class="sel-group-hint"></p>
        </div>
        <div class="pointer-mode" role="group" aria-label="Pointer mode">
          <button id="btn-mode-orbit" type="button" aria-pressed="true" title="Orbit camera">
            Orbit
          </button>
          <button
            id="btn-mode-place"
            type="button"
            aria-pressed="false"
            title="Move / rotate gizmo (pause first)"
          >
            Place
          </button>
        </div>
        <div class="gizmo-space" role="group" aria-label="Gizmo space" hidden>
          <button
            id="btn-gizmo-local"
            type="button"
            aria-pressed="true"
            title="Local axes"
          >
            Local
          </button>
          <button
            id="btn-gizmo-world"
            type="button"
            aria-pressed="false"
            title="World axes"
          >
            World
          </button>
        </div>
        <section
          id="pose-data-panel"
          class="pose-data-panel"
          aria-label="Transform"
          hidden
        >
          <header>
            <strong>Transform</strong>
          </header>
          <fieldset class="pose-data-fields" aria-label="Position meters">
            <legend>Position (m)</legend>
            <label>
              <span>X</span>
              <input
                id="pose-data-x"
                type="text"
                inputmode="decimal"
                data-pose-group="pos"
                autocomplete="off"
                spellcheck="false"
                disabled
              />
            </label>
            <label>
              <span>Y</span>
              <input
                id="pose-data-y"
                type="text"
                inputmode="decimal"
                data-pose-group="pos"
                autocomplete="off"
                spellcheck="false"
                disabled
              />
            </label>
            <label>
              <span>Z</span>
              <input
                id="pose-data-z"
                type="text"
                inputmode="decimal"
                data-pose-group="pos"
                autocomplete="off"
                spellcheck="false"
                disabled
              />
            </label>
          </fieldset>
          <fieldset class="pose-data-fields" aria-label="Rotation degrees">
            <legend>Rotation (°)</legend>
            <label>
              <span>X</span>
              <input
                id="pose-data-ex"
                type="text"
                inputmode="decimal"
                data-pose-group="euler"
                autocomplete="off"
                spellcheck="false"
                disabled
              />
            </label>
            <label>
              <span>Y</span>
              <input
                id="pose-data-ey"
                type="text"
                inputmode="decimal"
                data-pose-group="euler"
                autocomplete="off"
                spellcheck="false"
                disabled
              />
            </label>
            <label>
              <span>Z</span>
              <input
                id="pose-data-ez"
                type="text"
                inputmode="decimal"
                data-pose-group="euler"
                autocomplete="off"
                spellcheck="false"
                disabled
              />
            </label>
          </fieldset>
          <details class="pose-data-advanced">
            <summary>Advanced (quaternion)</summary>
            <fieldset class="pose-data-fields pose-data-quat" aria-label="Quaternion wxyz">
              <legend class="visually-hidden">Quat wxyz</legend>
              <label>
                <span>W</span>
                <input
                  id="pose-data-qw"
                  type="text"
                  inputmode="decimal"
                  data-pose-group="quat"
                  autocomplete="off"
                  spellcheck="false"
                  disabled
                />
              </label>
              <label>
                <span>X</span>
                <input
                  id="pose-data-qx"
                  type="text"
                  inputmode="decimal"
                  data-pose-group="quat"
                  autocomplete="off"
                  spellcheck="false"
                  disabled
                />
              </label>
              <label>
                <span>Y</span>
                <input
                  id="pose-data-qy"
                  type="text"
                  inputmode="decimal"
                  data-pose-group="quat"
                  autocomplete="off"
                  spellcheck="false"
                  disabled
                />
              </label>
              <label>
                <span>Z</span>
                <input
                  id="pose-data-qz"
                  type="text"
                  inputmode="decimal"
                  data-pose-group="quat"
                  autocomplete="off"
                  spellcheck="false"
                  disabled
                />
              </label>
            </fieldset>
          </details>
          <button
            id="btn-pose-apply"
            type="button"
            disabled
            title="Apply typed pose (pause first if running)"
          >
            Apply
          </button>
        </section>
        <section id="sg90-servo" class="sg90-servo" aria-label="SG90 servo" hidden>
          <header>
            <strong>Servo</strong>
          </header>
          <label class="horn-row" for="horn-select">
            <span>Horn</span>
            <select id="horn-select" disabled>
              <option value="cross" selected>Cross</option>
              <option value="single">1-arm</option>
              <option value="short">Short</option>
              <option value="long">Long</option>
              <option value="double">2-arm</option>
            </select>
          </label>
          <label class="horn-row horn-mount-row" for="horn-mount-select">
            <span>Mount</span>
            <select id="horn-mount-select" disabled>
              <option value="0" selected>0</option>
            </select>
          </label>
          <p id="horn-mount-note" class="spline-note" hidden></p>
          <div class="angle-presets" role="group" aria-label="Horn angle presets">
            <button type="button" data-angle="-90" disabled>−90°</button>
            <button type="button" data-angle="-45" disabled>−45°</button>
            <button type="button" data-angle="0" disabled>0°</button>
            <button type="button" data-angle="45" disabled>+45°</button>
            <button type="button" data-angle="90" disabled>+90°</button>
          </div>
          <label class="slider-row" for="angle-slider">
            <span>Angle</span>
            <input
              id="angle-slider"
              type="range"
              min="-90"
              max="90"
              step="1"
              value="0"
              disabled
            />
            <span id="angle-readout">0.0°</span>
          </label>
          <label class="load-row" for="load-toggle">
            <input id="load-toggle" type="checkbox" disabled />
            <span>Load</span>
          </label>
          <p id="motor-orient-note" class="spline-note" hidden></p>
        </section>
        <div class="place-nudge" role="group" aria-label="Nudge position">
          <span class="place-nudge-label">Nudge</span>
          <button type="button" data-nudge="-0.01,0,0" title="−X 1 cm">−X</button>
          <button type="button" data-nudge="0.01,0,0" title="+X 1 cm">+X</button>
          <button type="button" data-nudge="0,-0.01,0" title="−Y 1 cm">−Y</button>
          <button type="button" data-nudge="0,0.01,0" title="+Y 1 cm">+Y</button>
          <button type="button" data-nudge="0,0,-0.01" title="−Z 1 cm">−Z</button>
          <button type="button" data-nudge="0,0,0.01" title="+Z 1 cm">+Z</button>
        </div>
        <div class="sel-attach" role="group" aria-label="Glue / weld">
          <button
            id="btn-attach"
            type="button"
            disabled
            title="Weld selected to partner (Shift+click partner, or use ⊕ in Scene)"
          >
            Weld
          </button>
          <button
            id="btn-detach"
            type="button"
            disabled
            title="Break all welds on the selection"
          >
            Unweld
          </button>
          <button
            id="btn-deselect"
            type="button"
            title="Clear selection (Esc)"
          >
            Deselect
          </button>
        </div>
        <div class="sel-attach" role="group" aria-label="Save / copy pose">
          <button id="btn-copy-pose" type="button" disabled title="Copy pose JSON">
            Copy
          </button>
          <button
            id="btn-save-poses"
            type="button"
            disabled
            title="Download poses JSON"
          >
            Export
          </button>
        </div>
        <p id="sel-hint" class="sel-hint" hidden></p>
      </aside>

      
      <aside id="assemblies-panel" class="assemblies-panel" aria-label="Scene panels">
        <header class="panel-header" title="Drag to move panel">
          <span class="panel-drag-label">Scene</span>
        </header>
        <div class="panel-tabs" role="tablist" aria-label="Outliner and Library">
          <button
            type="button"
            role="tab"
            id="tab-outliner"
            aria-controls="pane-outliner"
            aria-selected="true"
            data-panel-tab="outliner"
          >
            Outliner
          </button>
          <button
            type="button"
            role="tab"
            id="tab-library"
            aria-controls="pane-library"
            aria-selected="false"
            data-panel-tab="library"
          >
            Library
          </button>
        </div>

        <div
          id="pane-outliner"
          class="panel-pane"
          role="tabpanel"
          aria-labelledby="tab-outliner"
          data-panel-pane="outliner"
        >
          <p id="assembly-meta" class="assembly-meta-line" role="status"></p>
          <div class="lab-parts-block">
            <ul id="lab-parts-list" class="lab-parts-list" aria-label="Parts in scene"></ul>
          </div>
          <div class="sel-attach" role="group" aria-label="Actions">
            <button
              id="btn-assembly-save"
              type="button"
              disabled
              title="Export poses JSON"
            >
              Export
            </button>
            <button id="btn-assembly-clear" type="button" disabled title="Clear assembly">
              Clear
            </button>
            <button
              id="btn-assembly-clone"
              type="button"
              disabled
              title="Duplicate selected SG90"
            >
              Duplicate
            </button>
          </div>
          <p id="assembly-clone-hint" class="assembly-status" role="status" hidden></p>
        </div>

        <div
          id="pane-library"
          class="panel-pane"
          role="tabpanel"
          aria-labelledby="tab-library"
          data-panel-pane="library"
          hidden
        >
          <p class="library-intro">
            Place a part into the open project — no need to select and Duplicate.
          </p>
          <ul id="library-list" class="library-list" aria-label="Part library"></ul>
          <p id="library-hint" class="assembly-status" role="status"></p>
        </div>
      </aside>

      <canvas id="c"></canvas>
    </div>
  </body>
</html>
