# One Dollar Computer — board pins (logical)
# Model 1.004 (fixed). Current published revision: R2.

# ⚠ PIN 13 (BUTTON) = BOOTLOADER ENTRY ONLY.
# Do NOT use as user-firmware input. Reclaiming it can break WebHID Upload.
# See /docs/BUTTON.md and /editor/AI_DOCS.txt

model: "1.004"
revision: R2
version: 1.004 R2
connector: ODC Port
# Port contacts are printed 1-8 at the port (the RJ45 order) ONLY to land a
# cable: they are printed on the board so you can match the wires of a
# standard RJ45 cable. Each contact IS one of the board pins below, and the
# board itself prints this correspondence beside the port. In code,
# documentation and instructions, a pin is ALWAYS its board number —
# a contact number never names a pin.
port_contacts:
  1: 7
  2: 6
  3: 1   # RX
  4: 14  # TX
  5: 18  # +5V
  6: 4
  7: 17  # GND
  8: 10  # +3.3V

# User firmware must use these numbers only (0..=19).
# This is the ONLY pin numbering — the number printed on the board.
# No chip pad names in code, docs or instructions, and a port contact
# number never names a pin. MCU pad names are NOT part of the public API.
# Chip mapping is internal — it is not part of this public map.
# Beginner GPIO: 0–9, 12, 14–15, 19. Skip pin 13.

pins:
  0:
    printed_label: "0"
    type: gpio
    description: "GPIO — PCB label 0"

  1:
    printed_label: "1"
    type: gpio
    description: "GPIO — PCB label 1"

  2:
    printed_label: "2"
    type: gpio
    description: "GPIO — PCB label 2"

  3:
    printed_label: "3"
    type: gpio
    description: "GPIO — PCB label 3"

  4:
    printed_label: "4"
    type: gpio
    description: "GPIO — PCB label 4"

  5:
    printed_label: "5"
    type: gpio
    description: "GPIO — PCB label 5"

  6:
    printed_label: "6"
    type: gpio
    description: "GPIO — PCB label 6"

  7:
    printed_label: "7"
    type: gpio
    description: "GPIO — PCB label 7"

  8:
    printed_label: "8"
    type: gpio
    description: "GPIO (analog-capable on current MCU) — PCB label 8"

  9:
    printed_label: "9"
    type: gpio
    description: "GPIO (analog-capable on current MCU) — PCB label 9"

  10:
    printed_label: "10"
    type: power
    description: "3.3V power output"

  11:
    printed_label: "11"
    type: ground
    description: "Ground"

  12:
    printed_label: "12"
    type: gpio
    description: "GPIO — PCB label 12 (shared with the programming link; using it as GPIO can pause programming until reboot)"

  13:
    printed_label: "13"
    type: button
    alias: BUTTON
    description: "Bootloader entry only (pull-up). Press to enter HID for Upload. Do not use as user-firmware input — reclaiming pin 13 can break WebHID reflash."

  14:
    printed_label: "14"
    type: gpio
    description: "GPIO — PCB label 14"

  15:
    printed_label: "15"
    type: gpio
    description: "GPIO — PCB label 15"

  16:
    printed_label: "16"
    type: nc
    description: "Not connected"

  17:
    printed_label: "17"
    type: ground
    description: "Ground"

  18:
    printed_label: "18"
    type: power
    description: "+5V power output / VBUS"

  19:
    printed_label: "19"
    type: led
    alias: LED
    description: "Onboard LED (BLINK). Use pin_set/pin_clear for logical on/off."
