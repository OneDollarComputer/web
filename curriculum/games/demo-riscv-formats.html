<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RISC-V format quiz</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    padding: 1rem;
    min-height: 100vh;
  }
  h1 { font-size: 1.1rem; margin: 0 0 .35rem; }
  p { margin: 0 0 .75rem; color: #94a3b8; font-size: .9rem; }
  .bits {
    font-family: ui-monospace, monospace;
    font-size: .72rem;
    letter-spacing: .04em;
    word-break: break-all;
    background: #1e293b;
    padding: .55rem .65rem;
    border-radius: 8px;
    margin-bottom: .75rem;
  }
  .bits span { padding: 0 .05rem; border-radius: 3px; }
  .bits .h { background: #334155; color: #cbd5e1; }
  .bits .q { background: #2563eb; color: #fff; }
  .molds {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: .45rem;
  }
  button {
    border: 1px solid #334155;
    background: #1e293b;
    color: #e2e8f0;
    border-radius: 8px;
    padding: .55rem .35rem;
    font: inherit;
    font-size: .82rem;
    cursor: pointer;
  }
  button:hover { border-color: #64748b; }
  button.correct { border-color: #22c55e; background: #14532d; }
  button.wrong { border-color: #ef4444; background: #450a0a; }
  .score { margin-top: .75rem; font-size: .88rem; color: #94a3b8; }
</style>
</head>
<body>
<h1>Which RISC-V format?</h1>
<p>Pick the instruction type for the highlighted opcode bits (bits 6–0).</p>
<div class="bits" id="bits"></div>
<div class="molds" id="molds"></div>
<div class="score" id="score">Score: 0</div>
<script>
const FORMATS = [
  { name: "R-type", op: "0110011", hint: "register-register ALU" },
  { name: "I-type", op: "0010011", hint: "immediate ALU / loads" },
  { name: "S-type", op: "0100011", hint: "store" },
  { name: "B-type", op: "1100011", hint: "branch" },
  { name: "U-type", op: "0110111", hint: "lui" },
  { name: "J-type", op: "1101111", hint: "jal" }
];
const SAMPLE = () => {
  const f = FORMATS[Math.floor(Math.random() * FORMATS.length)];
  let word = (parseInt(f.op, 2) | (Math.random() * 0x7fffff80 >>> 0)).>>>0;
  return { word, answer: f.name };
};
let round = SAMPLE();
let score = 0;
const bitsEl = document.getElementById("bits");
const moldsEl = document.getElementById("molds");
const scoreEl = document.getElementById("score");
function renderBits() {
  const s = round.word.toString(2).padStart(32, "0");
  bitsEl.innerHTML = s.split("").map((ch, i) => {
    const cls = i >= 25 ? "q" : "h";
    return `<span class="${cls}">${ch}</span>`;
  }).join("");
}
function nextRound() {
  round = SAMPLE();
  renderBits();
  [...moldsEl.querySelectorAll("button")].forEach((b) => {
    b.disabled = false;
    b.classList.remove("correct", "wrong");
  });
}
FORMATS.forEach((f) => {
  const b = document.createElement("button");
  b.textContent = f.name;
  b.title = f.hint;
  b.addEventListener("click", () => {
    if (b.disabled) return;
    const ok = f.name === round.answer;
    if (ok) score++;
    scoreEl.textContent = `Score: ${score}`;
    [...moldsEl.querySelectorAll("button")].forEach((x) => {
      x.disabled = true;
      if (x.textContent === round.answer) x.classList.add("correct");
      else if (x === b && !ok) x.classList.add("wrong");
    });
    setTimeout(nextRound, 900);
  });
  moldsEl.appendChild(b);
});
renderBits();
</script>
</body>
</html>
