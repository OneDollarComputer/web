<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join class — One Dollar Computer</title>
  <meta name="description" content="Join a live One Dollar Computer class — type odc.rs/1234" />
  <link rel="canonical" href="https://onedollarcomputer.com/curriculum/join/" />
  <link rel="stylesheet" href="/curriculum/workshop.css" />
</head>
<body>
  <header class="top">
    <a class="brand" href="/">One Dollar Computer</a>
  </header>

  <main>
    <section id="pinGate" class="panel pin-gate">
      <h1>Join class</h1>
      <p>Type the 4-digit code from your teacher, e.g. <strong>odc.rs/8709</strong></p>
      <form id="pinForm" class="pin-form">
        <input id="pinInput" type="text" inputmode="numeric" pattern="[0-9]{4}" maxlength="4"
          placeholder="8709" autocomplete="one-time-code" required />
        <button type="submit" class="primary">Join</button>
      </form>
      <p id="pinStatus" class="status" role="status"></p>
    </section>

    <section id="lessonView" class="panel slide-panel" hidden>
      <h1 id="lessonTitle" class="ws-lesson-title"></h1>
      <p id="slideProgress" class="slide-progress"></p>
      <div id="lessonBody" class="slide-body"></div>
      <section id="activityPanel" class="activity-panel" hidden>
        <h2 class="activity-heading">Do the activity</h2>
        <p class="activity-lede">Use the interactive lesson below while your teacher advances the slides.</p>
        <div id="activityBody"></div>
      </section>
      <div class="done-panel">
        <p class="done-label">Finished your build?</p>
        <div class="done-actions">
          <input id="photoInput" type="file" accept="image/*" hidden />
          <button type="button" id="btnCamera" class="ghost-sm">Camera</button>
          <button type="button" id="btnUpload" class="ghost-sm">Upload</button>
          <button type="button" id="btnDone" class="primary" hidden>Done</button>
        </div>
        <div id="photoPreview" class="photo-preview" hidden>
          <img id="photoPreviewImg" alt="" />
          <button type="button" id="btnClearPhoto" class="ghost-sm">Remove</button>
        </div>
        <dialog id="cameraDialog" class="camera-dialog">
          <video id="cameraVideo" autoplay playsinline muted></video>
          <div class="camera-actions">
            <button type="button" id="btnCapture" class="primary">Capture</button>
            <button type="button" id="btnCancelCamera" class="ghost-sm">Cancel</button>
          </div>
        </dialog>
        <p id="doneStatus" class="status" role="status"></p>
      </div>
    </section>
  </main>

  <script type="module" src="/curriculum/join.js"></script>
</body>
</html>
